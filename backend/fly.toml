# Fly.io deployment (see backend/DEPLOY.md). Change `app` to a name of your own; it becomes <app>.fly.dev.
app = "amrit-backend"
primary_region = "bom"          # Mumbai: lowest latency for phones in India

[build]
  dockerfile = "Dockerfile"

[env]
  CLIENT_IP_HEADER = "fly-client-ip"   # set by Fly's edge; used for per-IP rate limits (can't be spoofed by clients)
  OPENROUTER_MODELS = "google/gemma-4-31b-it,google/gemini-2.5-flash-lite"
  RESOLVE_PER_IP_PER_DAY = "80"
  DAILY_BUDGET_USD = "2.0"

[[mounts]]
  source = "amrit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1       # keep one warm during the hackathon so the first scan isn't a cold start

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
